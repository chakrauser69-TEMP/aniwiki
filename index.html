<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeWiki — Anime Encyclopedia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎌</text></svg>">
</head>
<body>
    <div class="bg-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <header class="header">
        <div class="header-inner">
            <a href="#/" class="logo" data-link>
                <span class="logo-icon">🎌</span>
                <span class="logo-text">AnimeWiki</span>
            </a>
            <div class="search-box">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
                </svg>
                <input type="text" id="search-input" placeholder="Search 15,000+ anime..." autocomplete="off">
                <div id="search-dropdown" class="search-dropdown"></div>
            </div>
            <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
                <span class="toggle-track"><span class="toggle-thumb"></span></span>
            </button>
        </div>
    </header>

    <main id="app" class="app"></main>

    <footer class="footer">
        <p>AnimeWiki — Data from MyAnimeList via <a href="https://huggingface.co/datasets/moviebrain01/anime-dataset-2025" target="_blank" rel="noopener">HuggingFace</a></p>
    </footer>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
